# SAST and test CI Github Actions suite 

name: Snyk and Test CI for locallm agent
run-name: "CI - ${{ github.actor }}"
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  sast_and_test:
    runs-on: ubuntu-latest
    steps: 
    - name: checkout code 
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Setup python 
      uses: actions/setup-python@v5 
      with: 
        python-version: "3.12" 
    - name: install dependencies 
      run: |
        uv sync 
    - name: Run pytest suite
      run: |
        uv run pytest tests/ 
  snyk_scan:
    runs-on: ubuntu-latest
    steps: 
    - name: checkout code 
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Setup python 
      uses: actions/setup-python@v5 
      with: 
        python-version: "3.12" 
    - name: install dependencies 
      run: |
        uv sync 
    - name: Snyk scan
      uses: snyk/actions/python@master 
      env: 
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} 
