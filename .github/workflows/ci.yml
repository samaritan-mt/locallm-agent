# SAST and test CI Github Actions suite 

name: Snyk and Test CI for locallm agent
run-name: "CI - ${{ github.actor }}"
on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main ]
jobs:
  sast_and_test:
    runs-on: ubuntu-latest
    steps: 
    - name: checkout code 
      uses: actions/checkout@v4
    - name: Setup python 
      uses: actions/setup-python@v6 
      with: 
        python-version: "3.14" 
    - name: install dependencies 
      run: |
        uv sync 
    - name: Run pytest suite (72 tests) 
      run: |
        python -m pytest tests/ 
  snyk_scan:
    runs-on: ubuntu-latest
    steps: 
    - name: checkout code 
      uses: actions/checkout@v4
    - name: Setup python 
      uses: actions/setup-python@v6 
      with: 
        python-version: "3.14" 
    - name: install dependencies 
      run: |
        uv sync 
    - name: Snyk scan
      uses: snyk/actions/python@master 
      env: 
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} 
    - name: Snyk SAST scan 
      uses: snyk/actions/code-scan@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} 
        base-dir: ${{ github.workspace }}


