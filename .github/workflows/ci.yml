# SAST and test CI Github Actions suite 

name: Snyk and Test CI for locallm agent
run-name: "CI - ${{ github.actor }}"
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  sast_and_test:
    runs-on: ubuntu-latest
    steps: 
    - name: checkout code 
      uses: actions/checkout@v4
    - name: Setup python 
      uses: actions/setup-python@v5 
      with: 
        python-version: "3.12" 
    - name: install dependencies 
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        pip install . pytest
    - name: Run pytest suite
      run: |
        source venv/bin/activate
        pytest tests/ 
  snyk_scan:
    runs-on: ubuntu-latest
    steps: 
    - name: checkout code 
      uses: actions/checkout@v4
    - name: Setup python 
      uses: actions/setup-python@v5 
      with: 
        python-version: "3.12" 
    - name: install dependencies 
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        pip install .
        pip freeze > requirements.txt
    - name: Setup Snyk
      uses: snyk/actions/setup@master
    - name: Snyk SAST (Code) scan
      run: snyk code test
      env: 
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} 
    - name: Snyk SCA (Open Source) scan
      run: snyk test --file=requirements.txt
      env: 
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} 
